<mat-toolbar color="primary" class="navbar">

  <span class="navbar-brand">E-Commerce</span>
  <span class="spacer"></span>

  <!-- 🔓 PUBLIC (NOT LOGGED IN) -->
  <ng-container *ngIf="!isCustomerLoggedIn && !isAdminLoggedIn">
    <button mat-button routerLink="/login">Login</button>
    <button mat-button routerLink="/register">Register</button>
  </ng-container>

  <!-- 🛠 ADMIN MENU -->
  <ng-container *ngIf="isAdminLoggedIn">
    <button mat-button routerLink="/admin/dashboard">Dashboard</button>
    <button mat-button routerLink="/admin/analytics">Analytics</button>
    <button mat-button routerLink="/admin/category">Category</button>
    <button mat-button routerLink="/admin/products">Products</button>
    <button mat-button routerLink="/admin/post-coupon">Post Coupon</button>
    <button mat-button routerLink="/admin/coupons">Coupons</button>

    <button mat-button (click)="logout()">Logout</button>
  </ng-container>

  <!-- 🛒 CUSTOMER MENU -->
  <ng-container *ngIf="isCustomerLoggedIn">
    <button mat-button routerLink="/customer/dashboard">Dashboard</button>
    <button mat-button routerLink="/customer/cart">Cart</button>
    <button mat-button routerLink="/customer/my_orders">Orders</button>
    <button mat-button routerLink="/customer/wishlist">Wishlist</button>
    <button mat-button routerLink="/customer/profile">Profile</button>

    <button mat-button (click)="logout()">Logout</button>
  </ng-container>

</mat-toolbar>

<!-- 👇 ROUTING OUTPUT -->
<router-outlet></router-outlet>
